spring.application.name=petcare
server.port=8080

# ===== Opción A (por defecto): H2 en memoria =====
spring.datasource.url=jdbc:h2:mem:petcare
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Opción B: MySQL (comenta la opción A y descomenta esto) =====
#spring.datasource.url=jdbc:mysql://localhost:3306/petcare?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
#spring.datasource.username=root
#spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
